# campuscommunity Nginx 网关配置（五容器版）
# 职责：前端静态资源托管 + /api/ 反向代理到 backend 容器 + Gzip 压缩
# 精细限流不在本层（limit_req 为漏桶语义，与业务层令牌桶口径冲突）——
# 分层限流：网关挡总量，应用层（Go 中间件）挡单用户
# 生成日期: 2026-08-06 · 五容器版: 2026-09-01

server {
    listen       80;
    server_name  localhost;

    # ---------- Gzip 压缩（CPU 换带宽：文本类压缩比高，收益显著） ----------
    gzip on;
    gzip_min_length 1k;            # 小于 1k 压缩收益低于 CPU 成本，不压
    gzip_comp_level 5;             # 1-9：5 为压缩比与 CPU 的均衡点（更高级别收益递减）
    gzip_vary on;                  # 响应加 Vary: Accept-Encoding，告知缓存代理区分压缩/未压缩版本
    # 只压文本类：图片/视频本身已压缩，再压不省带宽纯烧 CPU
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml;

    # ---------- 前端静态资源（npm run build 产物，挂载自宿主机 dist/） ----------
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;   # SPA 路由兜底：未命中文件回退 index.html
    }

    # ---------- 上传文件反代：头像等静态文件由 backend 卷存储，经此转发 ----------
    location /uploads/ {
        # 与 /api/ 同一套运行时解析方案：backend 容器重建换 IP 不 502
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream backend;
        proxy_pass http://$backend_upstream:8080;
        proxy_set_header Host $host;
    }

    # ---------- API 反向代理：服务名直连（compose 内部 DNS，不走宿主机映射端口） ----------
    location /api/ {
        # 运行时解析而非启动时缓存：proxy_pass 用静态主机名时 nginx 启动即解析
        # 并缓存 IP，backend 容器重建换 IP 后会 502；变量 + resolver 强制每次
        # 请求经 Docker 内置 DNS(127.0.0.11) 解析，valid=10s 缓存 10 秒
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream backend;
        proxy_pass http://$backend_upstream:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
