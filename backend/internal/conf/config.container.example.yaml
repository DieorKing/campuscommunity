# campuscommunity 后端配置模板（容器环境 · 脱敏版）
# 用法：复制为 config.container.yaml（同目录），无需改任何密码即可直接部署——
#       所有中间件密码统一为 12345678a，与 docker-compose.yml 默认值对齐。
#       生产环境部署前应替换为强密码（同步修改 docker-compose.yml 对应字段）。
# 配套：docker-compose.yml 挂载 config.container.yaml 到 /app/config/

name: campus_community_server
port: 8080
run_mode: release         # 容器即部署环境，固定 release
version: "v0.0.1"

mysql:
  host: "mysql"           # compose 服务名（内部 DNS）
  port: 3306              # 容器端口（不是宿主机映射端口）
  username: "root"
  password: "12345678a"   # 与 docker-compose.yml MYSQL_ROOT_PASSWORD 对齐
  database: "campuscommunity"
  charset: "utf8mb4"
  parse_time: true
  loc: "Local"            # 容器内 TZ=Asia/Shanghai（Dockerfile 设置）
  max_idle_conns: 100
  max_open_conns: 100
  conn_max_lifetime: "1h"

redis:
  host: "redis"           # compose 服务名
  port: 6379
  password: "12345678a"   # 与 docker-compose.yml requirepass 对齐
  db: 0
  pool_size: 10
  min_idle_conns: 5

rabbitmq:
  host: "rabbitmq"        # compose 服务名
  port: 5672
  username: trKing
  password: "12345678a"   # 与 docker-compose.yml RABBITMQ_DEFAULT_PASS 对齐
  vhost: "/"
  exchange: campus.community

jwt:
  secret: "your_secret_here"   # ← 替换为自定义密钥
  expire: "168h"
  issuer: "campuscommunity_backend"

snowflake:
  start_time: "2026-01-01"
  datacenter_id: 1
  worker_id: 1

upload:
  dir: "/app/uploads"        # compose 挂载命名卷 avatar-uploads 到此路径（容器重建不丢头像）
  max_size_mb: 5

log:
  level: "info"
  filename: "web_app.log"
  max_size: 200
  max_age: 30
  max_backups: 7
