# campuscommunity 后端配置模板（脱敏版）
# 用法：复制为 config.yaml 并填入真实密码
# 生成日期: 2026-08-06

name: campus_community_server
port: 8080
run_mode: debug            # debug / release

mysql:
  host: "127.0.0.1"
  port: 3306
  username: "root"
  password: "your_password_here"      # ← 替换为本地 MySQL root 密码
  database: "campuscommunity"
  charset: "utf8mb4"
  parse_time: true
  loc: "Local"
  max_idle_conns: 10
  max_open_conns: 100

redis:
  host: "192.168.81.129"   # 虚拟机 IP
  port: 6379
  password: "your_password_here"      # ← 替换为 Redis 密码
  db: 0
  pool_size: 10
  min_idle_conns: 5

rabbitmq:
  host: 127.0.0.1            # Docker 映射到宿主
  port: 5672
  username: guest
  password: guest
  vhost: "/"
  exchange: campus.community

jwt:
  secret: "your_secret_here"          # ← 替换为自定义密钥
  expire: 168               # 7 天，过期重登，无 refresh
  issuer: "campuscommunity_backend"

snowflake:
  start_time: "2026-01-01"   # 起始纪元，格式 2006-01-02（Go 参考时间）
  datacenter_id: 1           # 数据中心 ID，范围 0-31，多节点扩展时分配不同值
  worker_id: 1               # 工作节点 ID，范围 0-31，多节点扩展时分配不同值

log:
  level: "info"
  filename: "web_app.log"
  max_size: 200
  max_age: 30
  max_backups: 7
