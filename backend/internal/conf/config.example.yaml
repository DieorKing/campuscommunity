# campuscommunity 后端配置模板（本地开发环境 · 脱敏版）
# 用法：复制为 config.yaml。密码统一 12345678a，与 README 部署文档对齐；
#       本地组件密码不同时替换为真实值。容器部署用 config.container.example.yaml。
# 生成日期: 2026-08-06

name: campus_community_server
port: 8080
run_mode: debug            # debug / release

mysql:
  host: "127.0.0.1"
  port: 3306
  username: "root"
  password: "12345678a"               # 本地 MySQL root 密码（不同则替换）
  database: "campuscommunity"
  charset: "utf8mb4"
  parse_time: true
  loc: "Local"
  max_idle_conns: 100     # 建议 ≈ max_open_conns：高频短查询场景连接全保活，防连接风暴
  max_open_conns: 100
  conn_max_lifetime: "1h" # 连接定期换新，防被 MySQL wait_timeout 终结长连接

redis:
  host: "127.0.0.1"        # 本地/容器映射
  port: 6379
  password: "12345678a"               # Redis 密码（不同则替换）
  db: 0
  pool_size: 10
  min_idle_conns: 5

rabbitmq:
  host: 127.0.0.1            # Docker 映射到宿主
  port: 5672
  username: trKing
  password: "12345678a"               # 与 docker-compose.yml 对齐
  vhost: "/"
  exchange: campus.community

jwt:
  secret: "your_secret_here"          # ← 替换为自定义密钥
  expire: "168h"            # 7 天，过期重登，无 refresh；必须带单位（裸数字被解析为纳秒）
  issuer: "campuscommunity_backend"

snowflake:
  start_time: "2026-01-01"   # 起始纪元，格式 2006-01-02（Go 参考时间）
  datacenter_id: 1           # 数据中心 ID，范围 0-31，多节点扩展时分配不同值
  worker_id: 1               # 工作节点 ID，范围 0-31，多节点扩展时分配不同值

upload:
  dir: "./uploads"           # 上传文件根目录（头像存 {dir}/avatars/，相对运行 cwd）
  max_size_mb: 5             # 单文件大小上限

log:
  level: "info"
  filename: "web_app.log"
  max_size: 200
  max_age: 30
  max_backups: 7
